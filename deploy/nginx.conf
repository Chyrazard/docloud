server {
 listen 80;
 listen [::]:80;
 server_name dogs.belctech.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/docloud-acme; }
 location / { return 301 https://dogs.belctech.com$request_uri; }
}
server {
 listen 127.0.0.1:8443 ssl;
 listen [::1]:8443 ssl;
 server_name dogs.belctech.com;
 ssl_certificate /etc/letsencrypt/live/dogs.belctech.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/dogs.belctech.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 8m;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Robots-Tag "noindex, nofollow" always;
 access_log /var/log/nginx/docloud.access.log;
 error_log /var/log/nginx/docloud.error.log;
 location ~ /\. { return 404; }
 location / {
  proxy_pass http://127.0.0.1:3270;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_read_timeout 60s;
 }
}
