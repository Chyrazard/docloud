<svg class="toby-art toby-is-greet  " viewBox="15 15 330 330" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Toby · greet" focusable="false"><style>.toby-art {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  isolation: isolate;
  --toby-look-x: 0px;
  --toby-look-y: 0px;
}
.toby-body {
  transform-origin: 198px 327px;
  animation: toby-breathe 4.6s ease-in-out infinite;
}
.toby-tail {
  transform-origin: 299px 191px;
  animation: toby-tail-wag 2.4s ease-in-out infinite;
}
.toby-head {
  transform-origin: 116px 139px;
  animation: toby-head-idle 7s ease-in-out infinite;
}
.toby-ear-left {
  transform-origin: 88px 56px;
}
.toby-ear-right {
  transform-origin: 146px 56px;
}
.toby-eye-left {
  transform-origin: 87px 86px;
}
.toby-eye-right {
  transform-origin: 135px 86px;
}
.toby-eye {
  animation: toby-blink 5.6s ease-in-out infinite;
}
.toby-pupil-look {
  transform: translate(var(--toby-look-x, 0px), var(--toby-look-y, 0px));
  transition: transform 0.12s ease-out;
}
.toby-tag {
  transform-origin: 117px 149px;
  animation: toby-tag-swing 4.6s ease-in-out infinite;
}
.toby-sleep-eyes,
.toby-scratch-leg,
.toby-fleas {
  opacity: 0;
}
.toby-tongue {
  transform-origin: 114px 134px;
  transform: scaleY(0.05);
  opacity: 0;
}
.toby-front-paw-right {
  transform-origin: 153px 231px;
}
.toby-front-paw-left {
  transform-origin: 116px 231px;
}
.toby-ground {
  transform-origin: 196px 335px;
  animation: toby-ground-breathe 4.6s ease-in-out infinite;
}
.toby-is-greet .toby-front-paw-right {
  animation: toby-wave 0.55s ease-in-out infinite;
}
.toby-is-greet .toby-head {
  animation: toby-hello-head 1.1s ease-in-out infinite;
}
.toby-is-greet .toby-tail,
.toby-is-happy .toby-tail {
  animation: toby-tail-happy 0.35s ease-in-out infinite;
}
.toby-is-happy .toby-tongue,
.toby-is-greet .toby-tongue {
  opacity: 1;
  transform: scaleY(0.65);
  animation: toby-pant 0.7s ease-in-out infinite;
}
.toby-is-happy .toby-ear-left {
  animation: toby-ear-flop 1.1s ease-in-out infinite;
}
.toby-is-happy .toby-head {
  animation: toby-hello-head 2s ease-in-out infinite;
}
.toby-is-scratch .toby-head {
  animation: toby-scratch-head 0.32s ease-in-out infinite;
}
.toby-is-scratch .toby-body {
  animation: toby-scratch-body 0.32s ease-in-out infinite;
}
.toby-is-scratch .toby-ear-right {
  animation: toby-ear-scratch 0.16s ease-in-out infinite;
}
.toby-is-scratch .toby-scratch-leg {
  opacity: 1;
  transform-origin: 274px 229px;
  animation: toby-scratch-paw 0.16s ease-in-out infinite;
}
.toby-is-scratch .toby-seated-hind {
  opacity: 0;
}
.toby-is-scratch .toby-eye-right {
  animation: none;
  transform: scaleY(0.3);
}
.toby-is-scratch .toby-fleas {
  opacity: 1;
}
.toby-flea-one {
  transform-origin: 162px 138px;
  animation: toby-flea-hop 0.65s ease-out infinite;
}
.toby-flea-two {
  transform-origin: 178px 145px;
  animation: toby-flea-hop 0.65s 0.22s ease-out infinite;
}
.toby-scratch-spark {
  animation: toby-scratch-spark 0.3s ease-in-out infinite;
}
.toby-is-lick .toby-tongue {
  opacity: 1;
  animation: toby-lick 0.85s ease-in-out infinite;
}
.toby-is-lick .toby-head {
  animation: toby-lick-head 1.7s ease-in-out infinite;
}
.toby-is-lick .toby-eye-left {
  animation: toby-lick-eye 0.85s ease-in-out infinite;
}
.toby-is-sleep .toby-eyes {
  opacity: 0;
}
.toby-is-sleep .toby-sleep-eyes {
  opacity: 1;
}
.toby-is-sleep .toby-head {
  transform: rotate(8deg) translateY(3px);
  animation: toby-sleep-head 5s ease-in-out infinite;
}
.toby-is-sleep .toby-tail {
  animation: none;
}
.toby-is-happy:not(.toby-face) {
  transform-origin: 180px 330px;
  animation: toby-happy-hop 0.62s ease-in-out infinite;
}
@keyframes toby-breathe {
  0%,
  100% {
    transform: scale(1, 1);
  }
  50% {
    transform: scale(1.005, 1.009);
  }
}
@keyframes toby-happy-hop {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  35% {
    transform: translateY(-3px) scale(1.005, 1.012);
  }
  70% {
    transform: translateY(0) scale(1.008, 0.994);
  }
}
@keyframes toby-head-idle {
  0%,
  20%,
  100% {
    transform: rotate(0);
  }
  45%,
  60% {
    transform: rotate(-3deg) translateY(-1px);
  }
  80% {
    transform: rotate(1.5deg);
  }
}
@keyframes toby-tail-wag {
  0%,
  70%,
  100% {
    transform: rotate(0);
  }
  76%,
  88% {
    transform: rotate(-12deg);
  }
  82%,
  94% {
    transform: rotate(10deg);
  }
}
@keyframes toby-tail-happy {
  0%,
  100% {
    transform: rotate(-13deg);
  }
  50% {
    transform: rotate(16deg);
  }
}
@keyframes toby-blink {
  0%,
  41%,
  46%,
  85%,
  90%,
  100% {
    transform: scaleY(1);
  }
  43%,
  87% {
    transform: scaleY(0.08);
  }
}
@keyframes toby-tag-swing {
  0%,
  100% {
    transform: rotate(-5deg);
  }
  50% {
    transform: rotate(5deg);
  }
}
@keyframes toby-ground-breathe {
  0%,
  100% {
    transform: scaleX(1);
    opacity: 0.8;
  }
  50% {
    transform: scaleX(0.96);
    opacity: 0.65;
  }
}
@keyframes toby-wave {
  0%,
  100% {
    transform: translate(-2px, -5px) rotate(38deg);
  }
  50% {
    transform: translate(-3px, -7px) rotate(51deg);
  }
}
@keyframes toby-hello-head {
  0%,
  100% {
    transform: rotate(-4deg) translateY(-1px);
  }
  50% {
    transform: rotate(3deg) translateY(-2px);
  }
}
@keyframes toby-pant {
  0%,
  100% {
    transform: scaleY(0.6);
  }
  50% {
    transform: scaleY(0.85);
  }
}
@keyframes toby-ear-flop {
  0%,
  100% {
    transform: rotate(0);
  }
  50% {
    transform: rotate(-12deg) translateY(-1px);
  }
}
@keyframes toby-ear-scratch {
  0%,
  100% {
    transform: rotate(5deg);
  }
  50% {
    transform: rotate(-5deg);
  }
}
@keyframes toby-scratch-paw {
  0%,
  100% {
    transform: rotate(-3deg) translate(0, -2px);
  }
  50% {
    transform: rotate(5deg) translate(0, -7px);
  }
}
@keyframes toby-scratch-head {
  0%,
  100% {
    transform: rotate(9deg) translate(3px, 1px);
  }
  50% {
    transform: rotate(12deg) translate(4px, 2px);
  }
}
@keyframes toby-scratch-body {
  0%,
  100% {
    transform: rotate(1deg);
  }
  50% {
    transform: rotate(2deg);
  }
}
@keyframes toby-flea-hop {
  0% {
    opacity: 0;
    transform: translate(-7px, 10px) rotate(-20deg);
  }
  20% {
    opacity: 0.7;
  }
  65% {
    opacity: 0.7;
    transform: translate(8px, -13px) rotate(30deg);
  }
  100% {
    opacity: 0;
    transform: translate(13px, -4px) rotate(50deg);
  }
}
@keyframes toby-scratch-spark {
  0%,
  100% {
    opacity: 0.3;
  }
  50% {
    opacity: 0.8;
  }
}
@keyframes toby-lick {
  0%,
  12%,
  100% {
    transform: scaleY(0.35);
    opacity: 0;
  }
  28% {
    transform: translate(-5px, -4px) rotate(13deg) scaleY(1);
    opacity: 1;
  }
  52%,
  67% {
    transform: translate(-16px, -20px) rotate(28deg) scale(1, 1.15);
    opacity: 1;
  }
  82% {
    transform: translate(-7px, -7px) rotate(15deg) scaleY(0.8);
    opacity: 1;
  }
}
@keyframes toby-lick-head {
  0%,
  100% {
    transform: rotate(-4deg);
  }
  50% {
    transform: rotate(2deg) translateY(-1px);
  }
}
@keyframes toby-lick-eye {
  0%,
  15%,
  80%,
  100% {
    transform: scaleY(1);
  }
  35%,
  60% {
    transform: scaleY(0.38);
  }
}
@keyframes toby-sleep-head {
  0%,
  100% {
    transform: rotate(8deg) translateY(2px);
  }
  50% {
    transform: rotate(9deg) translateY(3px);
  }
}
@keyframes toby-logo-hello {
  0%,
  100% {
    transform: rotate(0);
  }
  25% {
    transform: rotate(-10deg) translateY(-2px);
  }
  70% {
    transform: rotate(7deg) translateY(-3px);
  }
}
@keyframes toby-logo-wink {
  0%,
  25%,
  65%,
  100% {
    transform: scaleY(1);
  }
  40%,
  50% {
    transform: scaleY(0.1);
  }
}
@keyframes toby-wordmark-dot {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-4px);
  }
}
@keyframes toby-track-dot {
  0%,
  100% {
    opacity: 0.25;
    transform: translateY(0);
  }
  50% {
    opacity: 1;
    transform: translateY(-4px);
  }
}
@keyframes toby-intro-dismiss {
  0%,
  65% {
    opacity: 1;
    visibility: visible;
  }
  100% {
    opacity: 0;
    visibility: hidden;
  }
}
@keyframes toby-intro-glow {
  0% {
    opacity: 0.5;
    transform: scale(0.6);
  }
  100% {
    opacity: 1;
    transform: scale(1.1);
  }
}
@keyframes toby-intro-content {
  0% {
    opacity: 0;
    transform: translateY(9px) scale(0.95);
  }
  25%,
  70% {
    opacity: 1;
    transform: none;
  }
  100% {
    opacity: 0;
    transform: translateY(-9px) scale(1.02);
  }
}
@keyframes toby-spark-float {
  0%,
  100% {
    transform: translateY(0) rotate(0);
    opacity: 0.6;
  }
  50% {
    transform: translateY(-5px) rotate(10deg);
    opacity: 1;
  }
}
@keyframes toby-widget-arrive {
  0% {
    opacity: 0;
    transform: translateY(16px) scale(0.94);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}
@keyframes toby-panel-arrive {
  0% {
    opacity: 0;
    transform: translateY(8px) scale(0.97);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}
@keyframes toby-message-arrive {
  0% {
    opacity: 0;
    transform: translateY(4px);
  }
  100% {
    opacity: 1;
    transform: none;
  }
}
